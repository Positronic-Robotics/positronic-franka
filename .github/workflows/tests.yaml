name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The libfranka version whose header franka/rate_limiting.h the Eigen-only tests use. Keep it the README's version.
env:
  LIBFRANKA_VERSION: 0.15.3

jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # The Desk client needs no compiled extension, so these tests run without libfranka.
      - name: Run the Desk client tests
        run: uvx --python 3.11 --with requests pytest tests

  impedance-law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      # impedance_law.hpp takes the FR3 joint speed limit from this header-only part of libfranka.
      - name: Fetch the libfranka rate limiting header
        run: |
          mkdir -p libfranka/include/franka
          curl -fsSL "https://raw.githubusercontent.com/frankarobotics/libfranka/${LIBFRANKA_VERSION}/include/franka/rate_limiting.h" \
            -o libfranka/include/franka/rate_limiting.h

      # The impedance law needs Eigen and one libfranka header, so this test runs without the libfranka library.
      - name: Run the impedance law tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I src -I libfranka/include $(pkg-config --cflags eigen3) \
            tests/test_impedance_law.cpp -o test_impedance_law
          ./test_impedance_law

  pose-ik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      # impedance_law.hpp takes the FR3 joint speed limit from this header-only part of libfranka.
      - name: Fetch the libfranka rate limiting header
        run: |
          mkdir -p libfranka/include/franka
          curl -fsSL "https://raw.githubusercontent.com/frankarobotics/libfranka/${LIBFRANKA_VERSION}/include/franka/rate_limiting.h" \
            -o libfranka/include/franka/rate_limiting.h

      # The pose IK takes the kinematics as an argument, so this test runs on FR3 kinematics without the libfranka library.
      - name: Run the pose IK tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I src -I libfranka/include $(pkg-config --cflags eigen3) \
            tests/test_pose_ik.cpp -o test_pose_ik
          ./test_pose_ik

  trajectory-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      # impedance_law.hpp takes the FR3 joint speed limit from this header-only part of libfranka.
      - name: Fetch the libfranka rate limiting header
        run: |
          mkdir -p libfranka/include/franka
          curl -fsSL "https://raw.githubusercontent.com/frankarobotics/libfranka/${LIBFRANKA_VERSION}/include/franka/rate_limiting.h" \
            -o libfranka/include/franka/rate_limiting.h

      # The trajectory generator needs Eigen, the vendored Ruckig and one libfranka header, so this test runs without the
      # libfranka library.
      # Ruckig needs C++20 and is built without the warning flags.
      - name: Run the trajectory generator tests
        run: |
          for f in $(ls external/ruckig/src/ruckig/*.cpp | grep -v -e cloud_client -e python); do
            g++ -std=c++20 -O2 -I external/ruckig/include -c "$f" -o "$(basename "$f" .cpp).o"
          done
          g++ -std=c++20 -Wall -Wextra -Werror -I src -I libfranka/include -I external/ruckig/include $(pkg-config --cflags eigen3) \
            tests/test_trajectory_generator.cpp *.o -o test_trajectory_generator
          ./test_trajectory_generator

  control-loop-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The watch uses only the standard library and drives a fake control loop, so this test runs without libfranka.
      - name: Run the control loop watch tests
        run: |
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -I src tests/test_control_loop_watch.cpp -o test_control_loop_watch
          ./test_control_loop_watch

  robot-control-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      # Robot runs on the fake libfranka in tests/fake_franka, so this test needs Eigen and the vendored Ruckig only.
      - name: Run the robot control link tests
        run: |
          for f in $(ls external/ruckig/src/ruckig/*.cpp | grep -v -e cloud_client -e python); do
            g++ -std=c++20 -O2 -I external/ruckig/include -c "$f" -o "$(basename "$f" .cpp).o"
          done
          g++ -std=c++20 -pthread -Wall -Wextra -Werror -I tests/fake_franka -I src -I external/ruckig/include \
            $(pkg-config --cflags eigen3) tests/test_robot_control_link.cpp *.o -o test_robot_control_link
          ./test_robot_control_link

  # The extension builds against the libfranka on the machine, so it is built here against each supported libfranka.
  # Ubuntu 24.04 is the system of the README; Ubuntu 22.04 is the system of the positronic hardware image.
  build:
    strategy:
      fail-fast: false
      matrix:
        libfranka: ["0.15.3", "0.21.3"]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      ROBOTPKG_PREFIX: /opt/openrobots
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ruckig includes <format>, which GCC 13 is the first to ship. Ubuntu 22.04 carries GCC 11.
      - name: Install GCC 13
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install the libfranka dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl lsb-release libeigen3-dev libpoco-dev \
            libpcre3-dev libfmt-dev libconsole-bridge-dev libtinyxml2-dev
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL http://robotpkg.openrobots.org/packages/debian/robotpkg.asc \
            | sudo tee /etc/apt/keyrings/robotpkg.asc > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/robotpkg.asc] http://robotpkg.openrobots.org/packages/debian/pub $(lsb_release -cs) robotpkg" \
            | sudo tee /etc/apt/sources.list.d/robotpkg.list
          sudo apt-get update
          sudo apt-get install -y robotpkg-pinocchio
          echo "PINOCCHIO_VERSION=$(dpkg-query -W -f='${Version}' robotpkg-pinocchio)" >> "$GITHUB_ENV"
          echo "LIBFRANKA_PREFIX=$HOME/libfranka-install" >> "$GITHUB_ENV"
          # The linker reads it to find Pinocchio under libfranka, and the loader reads it to find both.
          echo "LD_LIBRARY_PATH=$HOME/libfranka-install/lib:$ROBOTPKG_PREFIX/lib" >> "$GITHUB_ENV"

      # libfranka links Pinocchio, so a new Pinocchio package builds libfranka again.
      - name: Restore libfranka
        id: libfranka-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBFRANKA_PREFIX }}
          key: libfranka-${{ matrix.libfranka }}-${{ matrix.os }}-pinocchio-${{ env.PINOCCHIO_VERSION }}

      - name: Build libfranka ${{ matrix.libfranka }}
        if: steps.libfranka-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ matrix.libfranka }}" --recurse-submodules --shallow-submodules \
            https://github.com/frankarobotics/libfranka "$RUNNER_TEMP/libfranka"
          cmake -S "$RUNNER_TEMP/libfranka" -B "$RUNNER_TEMP/libfranka/build" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_PREFIX_PATH="$ROBOTPKG_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$LIBFRANKA_PREFIX"
          cmake --build "$RUNNER_TEMP/libfranka/build" -j 4
          cmake --install "$RUNNER_TEMP/libfranka/build"

      - uses: astral-sh/setup-uv@v5

      - name: Build positronic-franka
        run: |
          uv venv --python 3.11
          CMAKE_PREFIX_PATH="$LIBFRANKA_PREFIX:$ROBOTPKG_PREFIX" uv pip install --python .venv/bin/python .

      # libfranka puts major.minor in its soname, so the soname names the libfranka that the extension loads.
      - name: Load the extension and check its libfranka
        run: |
          version="${{ matrix.libfranka }}"
          extension=$(.venv/bin/python -c 'import positronic_franka._franka as m; print(m.__file__)')
          ldd "$extension" | grep libfranka
          ldd "$extension" | grep -q "libfranka.so.${version%.*} => $LIBFRANKA_PREFIX/lib/"
